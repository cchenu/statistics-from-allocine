[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "statistics-from-allocine"
version = "3.5.2"
description = "App to have statistics about a films list from Allocine."
authors = [{name = "cchenu"}]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "deep-translator>=1.11.4",
    "pandas>=3.0.2",
    "plotly>=6.7.0",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "streamlit>=1.56.0",
    "tqdm>=4.67.3",
]

[project.optional-dependencies]
dev = [
    "black>=26.3.1",
    "ipykernel>=7.2.0",
    "isort>=8.0.1",
    "mypy>=1.20.1",
    "pandas-stubs>=3.0.0.260204",
    "pip-tools>=7.5.3",
    "plotly-stubs>=0.1.3",
    "pytest>=9.0.3",
    "ruff>=0.15.11",
    "types-requests>=2.33.0.20260408",
    "types-tqdm>=4.67.3.20260408",
]

[project.urls]
homepage = "https://github.com/cchenu/statistics-from-allocine"
documentation = "https://github.com/cchenu/statistics-from-allocine"
repository = "https://github.com/cchenu/statistics-from-allocine"

[tool.ruff]
line-length = 79
target-version = "py312"
fix = false
extend-exclude = ["venv"]

[tool.ruff.lint]
unfixable = []
select = [
  "ALL"
]

ignore = [
  "PLR0904", # too-many-public-methods
  "PLR0913", # Too many arguments to function call
  "PLR0911", # Too many returns
  "PLR0912", # Too many branches
  "PLR0914", # Too many locals
  "PLR0915", # Too many statements
  "D203", # incorrect-blank-line-before-class
  "D212", # multi-line-summary-first-line 
  "COM812", # missing-trailing-coma
  "FBT001", # boolean-type-hint-positional-argument
  "FBT002", # boolean-default-value-positional-argument
  "C901", # complex-structure
  "CPY001", # missing-copyright-notice
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "S101", # assert
  "PLR2004", # magic-value-comparison
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true
quote-style = "preserve"

[tool.black]
line-length = 79
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
disallow_any_unimported = true
# disallow_any_expr = true
disallow_any_decorated = true
disallow_any_explicit = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = "deep_translator.*"
ignore_missing_imports = true


[tool.isort]
profile = "black"
